<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hasil Skrining TB Digital — Mobile</title>
    <meta name="description" content="Hasil evaluasi skrining mandiri TB dan rujukan pemeriksaan Puskesmas Lok Bahu." />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Helper JS (harus SEBELUM Alpine.js) -->
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/questions.js"></script>
    <script src="../assets/js/logic.js"></script>
    <!-- Definisi Komponen Alpine -->
    <script>
    function hasilScreeningApp() {
        return {
            dataSkrining: null,
            pasien: {},
            hasil: {},
            puskesmasConfig: window.PUSKESMAS_CONFIG,
            linkWhatsAppPetugas: '#',
            tanggalSkriningFormatted: '',
            showPosterModal: false,
            posterExists: false,
            zoomScale: 1,
            panX: 0,
            panY: 0,
            isDragging: false,
            startX: 0,
            startY: 0,

            bukaModal() {
                this.zoomScale = 1;
                this.panX = 0;
                this.panY = 0;
                this.isDragging = false;
                this.showPosterModal = true;
            },
            zoomIn() {
                if (this.zoomScale < 3.2) {
                    this.zoomScale = +(this.zoomScale + 0.35).toFixed(2);
                }
            },
            zoomOut() {
                if (this.zoomScale > 0.6) {
                    this.zoomScale = +(this.zoomScale - 0.35).toFixed(2);
                    if (this.zoomScale <= 1) {
                        this.panX = 0;
                        this.panY = 0;
                    }
                }
            },
            resetZoom() {
                this.zoomScale = 1;
                this.panX = 0;
                this.panY = 0;
            },
            startDrag(e) {
                this.isDragging = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                this.startX = clientX - this.panX;
                this.startY = clientY - this.panY;
            },
            onDrag(e) {
                if (!this.isDragging) return;
                if (e.cancelable) e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                this.panX = clientX - this.startX;
                this.panY = clientY - this.startY;
            },
            stopDrag() {
                this.isDragging = false;
            },

            get posterSrc() {
                return this.hasil.terduga ? '../assets/img/poster-terduga.png' : '../assets/img/poster-bukan-terduga.png';
            },
            get posterAlt() {
                return this.hasil.terduga ? 'Poster Edukasi Pasien Terduga TB' : 'Poster Edukasi Pencegahan Tuberkulosis';
            },
            get posterJudul() {
                return this.hasil.terduga ? 'Poster Panduan Pasien Terduga TB' : 'Poster Edukasi Pencegahan Tuberkulosis & PHBS';
            },
            get posterDeskripsi() {
                return this.hasil.terduga 
                    ? 'Panduan penanganan medis, tes dahak TCM gratis di Puskesmas Lok Bahu, etika batuk, dan perlindungan keluarga.'
                    : 'Panduan menjaga daya tahan tubuh, ventilasi udara rumah, dan perilaku hidup bersih & sehat (PHBS).';
            },
            get posterDownloadName() {
                return this.hasil.terduga ? 'Poster-Terduga-TB.png' : 'Poster-Pencegahan-TB.png';
            },

            initHasil() {
                const data = ambilHasil();
                if (!data) return;
                this.dataSkrining = data;
                this.pasien = data.pasien || {};
                this.hasil = data.hasil || {};
                this.tanggalSkriningFormatted = formatTanggal(data.waktuSkrining);
                this.linkWhatsAppPetugas = this.puskesmasConfig.getLinkWA(this.pasien, this.hasil);

                // Cek ketersediaan file poster
                const img = new Image();
                img.onload = () => { this.posterExists = true; };
                img.onerror = () => { this.posterExists = false; };
                img.src = this.posterSrc;
            },

            bagikanHasilWA() {
                const statusText = this.hasil.terduga ? 'TERDUGA TB' : 'BUKAN TERDUGA TB';
                let text = `Halo, saya baru saja melakukan Skrining Mandiri TB Digital.%0A`;
                text += `Hasil Skrining: *${statusText}*%0A`;
                if (this.hasil.terduga) {
                    text += `Disarankan pemeriksaan dahak TCM di Puskesmas Lok Bahu.%0A`;
                } else {
                    text += `Kondisi aman. Tetap terapkan pola hidup sehat dan etika batuk.%0A`;
                }
                text += `Skrining mandiri gratis dapat diakses melalui website skrining TB.`;
                window.open(`https://wa.me/?text=${text}`, '_blank');
            }
        };
    }
    </script>
    <!-- Alpine.js CDN (HARUS setelah definisi komponen) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Custom Mobile CSS -->
    <link rel="stylesheet" href="../assets/css/mobile.css" />
</head>
<body x-data="hasilScreeningApp()" x-init="initHasil()">

    <!-- Header Mobile -->
    <header class="mobile-header">
        <a href="index.html" class="text-white mr-1 p-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <div class="title-wrap">
            <h1 class="font-bold">Hasil Skrining TB</h1>
            <p>Rekomendasi Tindak Lanjut Medis</p>
        </div>
        <span class="badge-kemenkes">Puskesmas Lok Bahu</span>
    </header>

    <main class="page-pad space-y-4">

        <!-- ============================================================== -->
        <!-- JIKA TIDAK ADA DATA SKRINING                                   -->
        <!-- ============================================================== -->
        <div x-show="!dataSkrining" class="card p-6 text-center space-y-4">
            <div class="w-14 h-14 rounded-2xl bg-teal-50 border border-teal-200 text-teal-600 flex items-center justify-center mx-auto">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
                </svg>
            </div>
            <h2 class="text-gray-800 font-bold text-base">Belum Ada Riwayat Skrining</h2>
            <p class="text-xs text-gray-500">Anda belum mengisi formulir skrining mandiri TB atau sesi Anda telah berakhir.</p>
            <a href="form.html" class="btn btn-primary">Mulai Skrining Sekarang</a>
        </div>

        <!-- ============================================================== -->
        <!-- JIKA ADA DATA SKRINING                                         -->
        <!-- ============================================================== -->
        <template x-if="dataSkrining">
            <div class="space-y-4">

                <!-- ====================================================== -->
                <!-- KOP SURAT MEDIS RESMI (HANYA MUNCUL DI PDF / CETAK)    -->
                <!-- ====================================================== -->
                <div class="print-only print-kop">
                    <div class="print-kop-header">
                        <div class="print-kop-logo">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                                <path d="M12 8v8m-4-4h8"/>
                            </svg>
                        </div>
                        <div class="print-kop-text">
                            <h3>PEMERINTAH KOTA SAMARINDA • DINAS KESEHATAN</h3>
                            <h2>PUSKESMAS LOK BAHU</h2>
                            <p>Jl. Ir. H. Nusyirwan Ismail, M.Si. (Ring Road 2) RT. 15, Kel. Lok Bahu, Kec. Sungai Kunjang, Samarinda 75129</p>
                            <p>Layanan TCM Dahak: Senin – Sabtu, 08.00 – 14.00 WITA • WhatsApp Pelayanan: +62 857-5355-1401</p>
                        </div>
                    </div>
                    <div class="print-doc-title">
                        <h1>LEMBAR HASIL SKRINING MANDIRI TUBERKULOSIS (TB)</h1>
                        <div class="print-doc-meta">
                            <span>Waktu Pemeriksaan: <strong x-text="tanggalSkriningFormatted"></strong></span>
                            <span>Sifat Dokumen: <strong>Penapisan Awal Mandiri</strong></span>
                        </div>
                    </div>
                </div>

                <!-- 1. STATUS BADGE HERO CARD -->
                <div class="card overflow-hidden">
                    <div class="card-teal-bar" :style="hasil.terduga ? 'background: linear-gradient(90deg, #e11d48, #f43f5e);' : 'background: linear-gradient(90deg, #16a34a, #22c55e);'"></div>
                    
                    <div class="status-badge-wrap">
                        <!-- Icon Ring -->
                        <div class="status-icon-ring" :class="hasil.terduga ? 'merah' : 'hijau'">
                            <template x-if="hasil.terduga">
                                <svg class="w-8 h-8 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                                </svg>
                            </template>
                            <template x-if="!hasil.terduga">
                                <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </template>
                        </div>

                        <!-- Status Label -->
                        <h2 class="status-judul" :class="hasil.terduga ? 'merah' : 'hijau'" x-text="hasil.terduga ? 'TERDUGA TB' : 'BUKAN TERDUGA TB'"></h2>
                        
                        <!-- Penjelasan Singkat -->
                        <p class="status-sub" x-text="hasil.terduga 
                            ? 'Berdasarkan gejala yang dilaporkan, Anda memenuhi kriteria Terduga TB (Suspek TB) untuk tindak lanjut pemeriksaan faskes.' 
                            : 'Saat ini Anda tidak memenuhi kriteria Terduga TB. Tetap terapkan pola hidup sehat dan etika batuk.'">
                        </p>
                    </div>

                    <!-- Indikasi / Alasan Terduga (Jika ada) -->
                    <div x-show="hasil.alasan && hasil.alasan.length > 0" class="bg-rose-50/70 border-t border-rose-100 p-4">
                        <div class="flex items-center gap-1.5 mb-2">
                            <svg class="w-3.5 h-3.5 text-rose-700 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                            </svg>
                            <span class="text-[11px] font-bold text-rose-800 uppercase tracking-wider block">Indikasi Gejala Terdeteksi:</span>
                        </div>
                        <ul class="alasan-list">
                            <template x-for="(als, idx) in hasil.alasan" :key="idx">
                                <li x-text="als"></li>
                            </template>
                        </ul>
                    </div>
                </div>

                <!-- 2. CARD PUSKESMAS RUJUKAN & CTA WHATSAPP (FITUR UTAMA) -->
                <div class="puskesmas-card">
                    <div class="pk-header">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                        </svg>
                        <div>
                            <h3 class="font-bold" x-text="puskesmasConfig.namaPuskesmas"></h3>
                            <p>Fasilitas Pelayanan Kesehatan Rujukan</p>
                        </div>
                    </div>

                    <div class="pk-body space-y-3">
                        <div class="pk-info-row">
                            <svg fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                            </svg>
                            <p>Petugas Penanggung Jawab: <strong x-text="puskesmasConfig.namaPetugas"></strong></p>
                        </div>

                        <div class="pk-info-row">
                            <svg fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
                            </svg>
                            <p>Alamat: <span x-text="puskesmasConfig.alamat"></span></p>
                        </div>

                        <div class="pk-info-row">
                            <svg fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
                            </svg>
                            <p>Layanan Tes TCM: <span x-text="puskesmasConfig.jamLayanan"></span></p>
                        </div>

                        <!-- CTA TOMBOL WHATSAPP RESMI -->
                        <div class="pt-2">
                            <a :href="linkWhatsAppPetugas" target="_blank" class="btn btn-wa w-full">
                                <svg class="w-5 h-5 fill-current mr-1" viewBox="0 0 24 24">
                                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
                                </svg>
                                <span>Hubungi WA Puskesmas Lok Bahu</span>
                            </a>
                            <p class="text-[11px] text-gray-400 text-center mt-1.5">Pesan otomatis berisi ringkasan hasil skrining Anda siap dikirim.</p>
                        </div>
                    </div>
                </div>

                <!-- 3. LANGKAH TINDAK LANJUT KESEHATAN -->
                <div class="card p-4 space-y-3">
                    <div class="border-b border-gray-100 pb-2">
                        <h3 class="text-teal-900 font-bold text-sm">Langkah Tindak Lanjut yang Harus Dilakukan</h3>
                    </div>

                    <!-- Rekomendasi Terduga -->
                    <template x-if="hasil.terduga">
                        <ul class="rekomendasi-list">
                            <li>
                                <div class="rec-icon bg-rose-50 text-rose-600">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                                    </svg>
                                </div>
                                <div>
                                    <strong class="text-gray-800 text-xs block">Pemeriksaan Dahak (Tes Cepat Molekuler / TCM)</strong>
                                    <p class="text-[11px] text-gray-500">Segera datang ke Puskesmas Lok Bahu. Pemeriksaan dahak dan pengobatan TB disediakan <strong>GRATIS</strong> oleh pemerintah.</p>
                                </div>
                            </li>
                            <li>
                                <div class="rec-icon bg-teal-50 text-teal-600">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                                    </svg>
                                </div>
                                <div>
                                    <strong class="text-gray-800 text-xs block">Selalu Gunakan Masker Medis</strong>
                                    <p class="text-[11px] text-gray-500">Gunakan masker saat berada di rumah dan tempat umum guna mencegah percikan droplet ke anggota keluarga lain.</p>
                                </div>
                            </li>
                            <li>
                                <div class="rec-icon bg-amber-50 text-amber-600">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                                    </svg>
                                </div>
                                <div>
                                    <strong class="text-gray-800 text-xs block">Buka Ventilasi Rumah & Sinar Matahari</strong>
                                    <p class="text-[11px] text-gray-500">Bakteri TB mati oleh sinar ultraviolet matahari. Pastikan jendela dibuka setiap pagi hari.</p>
                                </div>
                            </li>
                            <li>
                                <div class="rec-icon bg-emerald-50 text-emerald-600">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                                    </svg>
                                </div>
                                <div>
                                    <strong class="text-gray-800 text-xs block">Terapkan Etika Batuk yang Benar</strong>
                                    <p class="text-[11px] text-gray-500">Tutup mulut dan hidung dengan lengan atas bagian dalam atau tisu saat batuk/bersin, lalu buang tisu ke tempat sampah tertutup.</p>
                                </div>
                            </li>
                        </ul>
                    </template>

                    <!-- Rekomendasi Bukan Terduga -->
                    <template x-if="!hasil.terduga">
                        <ul class="rekomendasi-list">
                            <li>
                                <div class="rec-icon bg-emerald-50 text-emerald-600">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                                    </svg>
                                </div>
                                <div>
                                    <strong class="text-gray-800 text-xs block">Terapkan Perilaku Hidup Bersih & Sehat (PHBS)</strong>
                                    <p class="text-[11px] text-gray-500">Konsumsi makanan bergizi seimbang, perbanyak buah dan sayur, serta cuci tangan dengan sabun.</p>
                                </div>
                            </li>
                            <li>
                                <div class="rec-icon bg-teal-50 text-teal-600">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                                    </svg>
                                </div>
                                <div>
                                    <strong class="text-gray-800 text-xs block">Jaga Daya Tahan Tubuh</strong>
                                    <p class="text-[11px] text-gray-500">Istirahat yang cukup 7-8 jam per hari, hindari stres berlebih, dan olahraga teratur.</p>
                                </div>
                            </li>
                            <li>
                                <div class="rec-icon bg-amber-50 text-amber-600">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                                    </svg>
                                </div>
                                <div>
                                    <strong class="text-gray-800 text-xs block">Waspada Jika Batuk &gt; 2 Minggu</strong>
                                    <p class="text-[11px] text-gray-500">Apabila di kemudian hari mengalami batuk yang tidak kunjung sembuh hingga lebih dari 2 minggu, segera lakukan skrining ulang.</p>
                                </div>
                            </li>
                        </ul>
                    </template>
                </div>

                <!-- 4. INFOGRAFIS & POSTER EDUKASI SESUAI DIAGNOSIS (RASIO 1414 x 2000) -->
                <div class="card p-4 space-y-3">
                    <div class="border-b border-gray-100 pb-2">
                        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold mb-1.5"
                             :class="hasil.terduga ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                            <span x-text="hasil.terduga ? 'Poster Khusus: Terduga TB' : 'Poster Khusus: Bukan Terduga TB'"></span>
                        </div>
                        <h3 class="text-teal-900 font-bold text-sm" x-text="posterJudul"></h3>
                        <p class="text-[11px] text-gray-500 mt-0.5" x-text="posterDeskripsi"></p>
                    </div>

                    <!-- KONDISI 1: JIKA FILE POSTER SUDAH ADA -->
                    <div x-show="posterExists" class="space-y-2.5">
                        <div class="featured-poster-frame-m" @click="bukaModal()">
                            <img :src="posterSrc" :alt="posterAlt" class="featured-poster-img-m" />
                            <div class="poster-zoom-hint-m">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/>
                                </svg>
                                <span>Ketuk untuk Zoom HD</span>
                            </div>
                        </div>

                        <div class="flex items-center gap-2">
                            <button type="button" @click="bukaModal()" class="btn btn-sm btn-primary flex-1 text-xs py-2">
                                🔍 Lihat Ukuran Penuh (HD)
                            </button>
                            <a :href="posterSrc" :download="posterDownloadName" class="btn btn-sm btn-secondary text-xs py-2 px-3 flex items-center justify-center">
                                ⬇ Unduh
                            </a>
                        </div>
                    </div>

                    <!-- KONDISI 2: PLACEHOLDER KOSONG JIKA FILE POSTER BELUM DIMASUKKAN -->
                    <div x-show="!posterExists" class="p-5 rounded-2xl border-2 border-dashed border-gray-200 bg-gray-50/80 text-center flex flex-col items-center justify-center">
                        <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-2"
                             :class="hasil.terduga ? 'bg-rose-50 border border-rose-200 text-rose-600' : 'bg-teal-50 border border-teal-200 text-teal-600'">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-bold mb-1.5"
                              :class="hasil.terduga ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'"
                              x-text="hasil.terduga ? 'Slot Poster A (Terduga TB)' : 'Slot Poster B (Bukan Terduga TB)'"></span>
                        <h4 class="font-bold text-gray-800 text-xs mb-1" x-text="posterJudul"></h4>
                        <p class="text-[11px] text-gray-500 mb-2 leading-relaxed">
                            Area poster (rasio <strong>1414 × 2000 px</strong>) otomatis terisi saat file poster ditaruh di:
                        </p>
                        <code class="text-[11px] bg-white border border-gray-300 px-2.5 py-1 rounded-md text-teal-700 font-mono font-bold mb-1 shadow-xs"
                              x-text="hasil.terduga ? 'assets/img/poster-terduga.png' : 'assets/img/poster-bukan-terduga.png'"></code>
                        <p class="text-[10px] text-gray-400">Format: .png / .jpg / .webp</p>
                    </div>
                </div>

                <!-- 5. RINGKASAN DATA IDENTITAS PASIEN -->
                <div class="card p-4 space-y-3">
                    <div class="border-b border-gray-100 pb-2 flex justify-between items-center">
                        <h3 class="text-teal-900 font-bold text-sm">Data Ringkasan Responden</h3>
                        <span class="text-[10px] text-gray-400" x-text="tanggalSkriningFormatted"></span>
                    </div>

                    <div class="summary-grid">
                        <div class="summary-item">
                            <span class="si-label">Nama Lengkap</span>
                            <div class="si-val" x-text="pasien.nama || '-'"></div>
                        </div>
                        <div class="summary-item">
                            <span class="si-label">NIK</span>
                            <div class="si-val" x-text="pasien.nik || '-'"></div>
                        </div>
                        <div class="summary-item">
                            <span class="si-label">Usia & Kategori</span>
                            <div class="si-val" x-text="`${pasien.usia || '-'} Thn (${hasil.kategoriUsia})`"></div>
                        </div>
                        <div class="summary-item">
                            <span class="si-label">No. WhatsApp</span>
                            <div class="si-val" x-text="pasien.noHp || '-'"></div>
                        </div>
                        <div class="summary-item">
                            <span class="si-label">Riwayat Kontak</span>
                            <div class="si-val" x-text="pasien.riwayatKontak === 'ya' ? (pasien.jenisKontak === 'serumah' ? 'Kontak Serumah' : 'Kontak Erat') : 'Tidak Ada'"></div>
                        </div>
                        <div class="summary-item">
                            <span class="si-label">Status IMT</span>
                            <div class="si-val" x-text="pasien.imt ? `${pasien.imt} (${pasien.kategoriIMT})` : '-'"></div>
                        </div>
                        <div class="summary-item">
                            <span class="si-label">Merokok</span>
                            <div class="si-val capitalize" x-text="pasien.merokok || 'Tidak'"></div>
                        </div>
                    </div>
                </div>

                <!-- 5. TOMBOL AKSI TAMBAHAN -->
                <div class="space-y-2 pt-1">
                    <!-- Share WA ke Kerabat -->
                    <button type="button" @click="bagikanHasilWA()" class="btn btn-outline-teal">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
                        </svg>
                        <span>Bagikan Hasil ke Keluarga/Kerabat</span>
                    </button>

                    <!-- Cetak / PDF -->
                    <button type="button" @click="window.print()" class="btn btn-secondary">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
                        </svg>
                        <span>Cetak / Simpan Sebagai PDF</span>
                    </button>

                    <!-- Skrining Ulang -->
                    <a href="form.html" class="btn btn-secondary">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        <span>Skrining Ulang untuk Anggota Lain</span>
                    </a>
                </div>

                <!-- ====================================================== -->
                <!-- FOOTER & VALIDASI MEDIS (HANYA MUNCUL DI PDF / CETAK)  -->
                <!-- ====================================================== -->
                <div class="print-only print-footer-note">
                    <div class="print-faskes-box">
                        <strong>FASILITAS PELAYANAN KESEHATAN RUJUKAN:</strong><br>
                        <strong>Puskesmas Lok Bahu</strong> • Jl. Ir. H. Nusyirwan Ismail, M.Si. (Ring Road 2) RT. 15, Kelurahan Lok Bahu, Samarinda.<br>
                        Pelayanan Tes Cepat Molekuler (TCM) Dahak & Paket Obat TB disediakan <strong>GRATIS</strong> oleh pemerintah hingga tuntas.
                    </div>
                    <div class="print-disclaimer">
                        *Catatan Medis: Dokumen ini diterbitkan secara elektronik oleh Sistem Skrining TB Digital Puskesmas Lok Bahu berdasarkan penapisan mandiri keluhan gejala dan faktor risiko responden. Lembar ini merupakan penapisan awal, bukan diagnosis laboratorium definitif. Bagi responden dengan hasil Terduga TB, segera lakukan pemeriksaan dahak TCM ke Puskesmas Lok Bahu.
                    </div>
                </div>

            </div>
        </template>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            <span>Beranda</span>
        </a>
        <a href="form.html">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
            </svg>
            <span>Skrining</span>
        </a>
        <a href="hasil.html" class="active">
            <svg fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/>
            </svg>
            <span>Hasil</span>
        </a>
    </nav>

    <!-- Lightbox Modal Pan & Zoom Poster HD Mobile -->
    <div x-show="showPosterModal" x-cloak
         class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex flex-col justify-between p-3 select-none"
         @keydown.escape.window="showPosterModal = false">
        
        <!-- Header Modal Mobile -->
        <div class="flex items-center justify-between pb-2 text-white border-b border-teal-800/80 z-10 gap-2">
            <span class="text-xs font-semibold text-teal-200 truncate flex-1" x-text="posterJudul"></span>
            <span class="text-[10px] text-teal-300 bg-teal-900/60 px-2 py-0.5 rounded-full border border-teal-700/50">Tahan & Geser</span>
            <button @click="showPosterModal = false" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1 rounded-full font-bold transition text-white">✕</button>
        </div>

        <!-- Viewport Gambar (Touch Pan & Zoom) -->
        <div class="relative flex-1 overflow-hidden flex items-center justify-center my-2 rounded-xl bg-black/40 touch-none"
             @mousedown="startDrag($event)"
             @mousemove="onDrag($event)"
             @mouseup="stopDrag()"
             @mouseleave="stopDrag()"
             @touchstart="startDrag($event)"
             @touchmove="onDrag($event)"
             @touchend="stopDrag()"
             @touchcancel="stopDrag()">
            
            <img :src="posterSrc" :alt="posterAlt"
                 class="w-full h-auto object-contain block max-h-[78vh] rounded shadow-2xl pointer-events-none select-none"
                 :style="`transform: translate(${panX}px, ${panY}px) scale(${zoomScale}); transform-origin: center center; transition: ${isDragging ? 'none' : 'transform 0.12s ease-out'};`" />
        </div>

        <!-- Floating Zoom Toolbar (+ / - / Reset / Unduh) Mobile -->
        <div class="flex items-center justify-between pt-1 border-t border-teal-800/80 z-10 gap-2">
            <div class="flex items-center gap-1 bg-white/10 px-2 py-1 rounded-full border border-teal-700/60">
                <!-- Tombol Zoom Out (-) -->
                <button type="button" @click.stop="zoomOut()"
                        class="w-7 h-7 rounded-full bg-white/10 hover:bg-teal-600 active:scale-95 text-white flex items-center justify-center font-bold text-base transition"
                        title="Perkecil (−)">
                    −
                </button>

                <!-- Indikator Zoom Level -->
                <span class="text-[11px] font-mono font-bold text-teal-300 min-w-[38px] text-center"
                      x-text="Math.round(zoomScale * 100) + '%'">
                    100%
                </span>

                <!-- Tombol Zoom In (+) -->
                <button type="button" @click.stop="zoomIn()"
                        class="w-7 h-7 rounded-full bg-white/10 hover:bg-teal-600 active:scale-95 text-white flex items-center justify-center font-bold text-base transition"
                        title="Perbesar (+)">
                    +
                </button>

                <!-- Tombol Reset -->
                <button type="button" @click.stop="resetZoom()"
                        class="text-[10px] text-teal-300 hover:text-white px-2 py-1 rounded font-semibold border-l border-teal-700/60 ml-0.5">
                    Reset
                </button>
            </div>

            <!-- Tombol Unduh -->
            <a :href="posterSrc" :download="posterDownloadName"
               class="btn btn-sm btn-primary text-xs py-1.5 px-3 flex items-center gap-1 shadow">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                <span>Unduh</span>
            </a>
        </div>
    </div>

</body>
</html>
